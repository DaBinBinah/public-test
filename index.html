<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>网站连通成功</title>
  <style>
    :root { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; color: #14251f; background: #f3f7f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 560px); padding: 48px 40px; border: 1px solid #dce8df; border-radius: 24px; background: #fff; box-shadow: 0 22px 70px rgba(31, 74, 51, .09); text-align: center; }
    .mark { width: 64px; height: 64px; display: grid; place-items: center; margin: 0 auto 24px; border-radius: 50%; color: #087a4b; background: #e5f5ec; font-size: 30px; }
    h1 { margin: 0; font-size: clamp(26px, 6vw, 36px); letter-spacing: -.04em; }
    p { margin: 14px 0 0; color: #65736b; font-size: 16px; line-height: 1.7; }
    .status { display: inline-flex; align-items: center; gap: 9px; margin-top: 30px; padding: 10px 14px; border: 1px solid #dcefe3; border-radius: 999px; background: #f4fbf6; color: #236442; font-size: 13px; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #28a466; box-shadow: 0 0 0 4px rgba(40, 164, 102, .12); }
    footer { margin-top: 34px; color: #9aa59e; font-size: 12px; }
    @media (max-width: 480px) { main { padding: 38px 24px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✓</div>
    <h1>网站连通成功</h1>
    <p>公开网站已正常加载。<br>页面仅用于验证网站连通性。</p>
    <div class="status"><span class="dot"></span>服务运行正常</div>
    <footer>静态网站 · 不包含个人信息</footer>
  </main>
</body>
</html>
